name: Docker Image CI

on:
  push:
    branches: ["dev", "master"]
  pull_request:
    branches: ["dev", "master"]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Resolve target branch
      id: vars
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          echo "branch=${{ github.base_ref }}" >> "$GITHUB_OUTPUT"
        else
          echo "branch=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
        fi

    - name: Build the Docker image
      run: docker build . --target ${{ steps.vars.outputs.branch }} --file Dockerfile --tag ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}:${{ github.sha }}

    - name: Log in to Docker Hub
      if: github.event_name == 'push'
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Push Docker image
      if: github.event_name == 'push'
      run: |
        docker tag ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}:${{ steps.vars.outputs.branch }}
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}:${{ steps.vars.outputs.branch }}
