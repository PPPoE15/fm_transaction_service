name: Docker Image CI master

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker image
      run: docker build . --target master --file Dockerfile --tag ${{ secrets.DOCKERHUB_USERNAME }}/fm_transaction_service:${{ github.sha }}

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    
    - name: Push Docker image
      run: |
        docker tag ${{ secrets.DOCKERHUB_USERNAME }}/fm_transaction_service:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/fm_transaction_service:master
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/fm_transaction_service:master
